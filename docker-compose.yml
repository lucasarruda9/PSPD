services:
  modulo-p-gateway:
    build:
      context: .
      dockerfile: modulo_p_gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GRPC_SERVER_A=modulo-a-servidor:50051
      - GRPC_SERVER_B=modulo-b-servidor:50052
    networks:
      - pspd-net

  modulo-a-servidor:
    build:
      context: ./Servidores_GRPC
      dockerfile: Dockerfile.a
    ports:
      - "50051:50051"
    networks:
      - pspd-net

  modulo-b-servidor:
    build:
      context: .
      dockerfile: Servidores_GRPC/Dockerfile.b
    ports:
      - "50052:50052"
    volumes:
      - ./benchmarks/dataset:/app/dataset:rw
    networks:
      - pspd-net

  # --- Versao espelho REST/JSON (modulo_rest_mirror) ---
  modulo-rest-a:
    build:
      context: ./modulo_rest_mirror
      dockerfile: Dockerfile.a
    networks:
      - pspd-net

  modulo-rest-b:
    build:
      context: .
      dockerfile: modulo_rest_mirror/Dockerfile.b
    volumes:
      - ./benchmarks/dataset:/app/dataset:rw
    networks:
      - pspd-net

  modulo-rest-mirror:
    build:
      context: ./modulo_rest_mirror/gateway
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - REST_SERVER_A=http://modulo-rest-a:9001
      - REST_SERVER_B=http://modulo-rest-b:9002
    depends_on:
      - modulo-rest-a
      - modulo-rest-b
    networks:
      - pspd-net

networks:
  pspd-net:
    driver: bridge
