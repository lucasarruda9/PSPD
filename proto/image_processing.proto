syntax = "proto3";

package imageprocessing;

service ImageProcessorService {
    rpc ProcessarImagem (ImagemRequest) returns (ImagemResponse);
    rpc ProcessarEtapas (ImagemRequest) returns (stream EtapaResponse);
    rpc ProcessarLote (stream ImagemRequest) returns (LoteResponse);
    rpc ProcessarPreviewAoVivo (stream ImagemRequest) returns (stream EtapaResponse);
}

message ImagemRequest {
    bytes dados_imagem    = 1;
    string formato        = 2;
    string nome_arquivo   = 3;
    map<string, string> metadados = 4;
}

message ImagemResponse {
    bytes   imagem_processada  = 1;
    string  formato_saida      = 2;
    double  tempo_ms           = 3;
    repeated string etapas_aplicadas = 4;
    map<string, string> metadados_extraidos = 5;
}

message EtapaResponse {
    string  nome_etapa         = 1;
    bytes   imagem_parcial     = 2;
    double  tempo_etapa_ms     = 3;
    bool    ultima_etapa       = 4;
}

message LoteResponse {
    int32   total_processadas  = 1;
    int32   total_erros        = 2;
    double  tempo_total_ms     = 3;
    repeated string arquivos_processados = 4;
}
